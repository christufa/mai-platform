name: image

# Builds ghcr.io/<owner>/mai-base in two flavors (runtime, dev).
#
# Tags (per flavor, shown for runtime):
#   runtime                rolling: newest build of main
#   runtime-2026.10.14     one per build day, for pinning/rollback
#   runtime-0.2.0 / -0.2   release: push a git tag v0.2.0
#   runtime-sha-abc1234    the commit a push-build came from
#
# Triggers:
#   push to main (image/** changed)  build + push, then test the template on the new image
#   pull request (any)               `image-gate` always reports; builds (no push) only if image/** changed
#   weekly schedule                  full no-cache rebuild: fresh base image + apt upgrade
#   v* tag                           release build
#   manual                           workflow_dispatch (optionally no-cache)
#
# Security notes:
#   - token permissions default to none; each job requests only what it needs
#   - actions are pinned to commit SHAs (Renovate keeps them current)
#   - PRs (including forks) never push, sign or write the build cache

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: ["image/**", ".github/workflows/image.yml"]
  pull_request:   # no path filter: image-gate must report on every PR (required check)
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      no-cache:
        description: Rebuild every layer (picks up OS security patches)
        type: boolean
        default: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/mai-base
  # ---- version pins: change here, nowhere else -------------------------------
  CUDA_VERSION: "13.2.0"
  UBUNTU_VERSION: "24.04"
  PYTHON_VERSION: "3.12"

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # list the PR's changed files
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Did this change touch the image?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qE '^(image/|\.github/workflows/image\.yml$)' <<< "$files"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No image changes in this PR; skipping the image build."
          fi

  lock-check:
    name: lock-check
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false   # no shared cache in a workflow that publishes images
      - name: uv.lock is up to date with pyproject.toml
        working-directory: image
        run: uv lock --check

  build:
    name: build (${{ matrix.target }}, ${{ matrix.variant }})
    needs: [changes, lock-check]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest   # swap for a larger runner if builds get slow
    permissions:
      contents: read           # checkout
      packages: write          # push images + registry build cache (not granted to fork PRs)
      id-token: write          # keyless cosign signing via Sigstore
      security-events: write   # upload the vulnerability scan to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            variant: base
          - target: dev
            variant: devel
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      NO_CACHE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.no-cache) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # CUDA images + torch are large; the default runner disk is not enough.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          tool-cache: true
          large-packages: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.target }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-{{date 'YYYY.MM.DD'}},enable={{is_default_branch}}
            type=semver,pattern={{version}},prefix=${{ matrix.target }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.target }}-
            type=sha,prefix=${{ matrix.target }}-sha-,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=mai-base (${{ matrix.target }})
            ai.mai.cuda-version=${{ env.CUDA_VERSION }}

      # The smoke test (image/smoke_test.py) runs inside the build, so a broken
      # image fails here and is never pushed.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          target: ${{ matrix.target }}
          platforms: linux/amd64
          pull: true                     # always start from the newest NVIDIA base
          no-cache: ${{ env.NO_CACHE == 'true' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            BASE_VARIANT=${{ matrix.variant }}
          # Registry cache: the GHA cache (10 GB) is too small for torch layers.
          # Only trusted (non-PR) builds write it, so PRs can't poison it.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.target }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE, matrix.target) || '' }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: env.PUSH == 'true'

      - name: Sign image
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

      # Grype scan of the pushed image. Reports to Security → Code scanning;
      # does not fail the build (CUDA base images always carry some CVEs).
      # registry: reads the image straight from GHCR (no docker pull + save).
      # TMPDIR: Grype unpacks the image into the temp dir, and on ubuntu-26.04
      # /tmp is an 8 GB tmpfs, too small for these images ("disk quota exceeded").
      # scan.yml repeats this for already-published releases; keep them in sync.
      - name: Vulnerability scan
        id: scan
        if: env.PUSH == 'true'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          image: registry:${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          only-fixed: true
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      - name: Upload scan results
        if: env.PUSH == 'true' && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: mai-base-${{ matrix.target }}

      - name: Summary
        if: env.PUSH == 'true'
        env:
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### mai-base:${TARGET}"
            echo "Digest: \`${DIGEST}\`"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # After a trusted build on main, test the template against the new image.
  # (A reusable-workflow call replaces the old workflow_run trigger, which is
  # a known attack vector on public repos.)
  template:
    name: template
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read        # checkout
      packages: read        # pull the runtime image
      pull-requests: read   # used by the called workflow's change detection on PRs
    uses: ./.github/workflows/template.yml # zizmor: ignore[self-repository] -- standard local reusable-workflow path

  cleanup:
    # Prunes registry clutter after non-PR builds. Never touches release tags
    # (runtime-0.2.0), rolling tags (runtime, dev) or the build cache.
    # Run once with `dry-run: true` added if you want to see what it would delete.
    name: cleanup
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write   # delete old package versions
    steps:
      - name: Delete untagged + orphaned manifests
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: mai-base
          delete-untagged: true
          delete-orphaned-images: true
          delete-partial-images: true
          older-than: 7 days
      - name: Delete old sha- tags
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: mai-base
          delete-tags: "*-sha-*"
          older-than: 30 days
      - name: Delete dated builds older than 90 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: mai-base
          delete-tags: "runtime-20*,dev-20*"
          older-than: 90 days

  # Single required check for branch rulesets. Always runs, and passes when
  # every job above either succeeded or was skipped (e.g. docs-only PRs).
  image-gate:
    name: image-gate
    if: always()
    needs: [changes, lock-check, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A required image job failed"; exit 1 ;;
          esac
