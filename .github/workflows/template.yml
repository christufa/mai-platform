name: template

# Renders the Copier template with default answers and runs the generated
# project's lint + tests inside the published runtime image.
#
# Runs:
#   - on every PR (template-gate always reports; tests only if the template changed)
#   - on pushes to main that change the template
#   - called by the image workflow after each trusted image build on main,
#     so template + new image are always tested together
#
# If :runtime isn't published yet (brand-new repo), the test is skipped with a notice.

on:
  push:
    branches: [main]
    paths: ["template/**", "copier.yml", ".github/workflows/template.yml"]
  pull_request:   # no path filter: template-gate must report on every PR (required check)
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mai-base:runtime

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # list the PR's changed files
    outputs:
      template: ${{ steps.filter.outputs.template }}
    steps:
      - name: Did this change touch the template?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "template=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qE '^(template/|copier\.yml$|\.github/workflows/template\.yml$)' <<< "$files"; then
            echo "template=true" >> "$GITHUB_OUTPUT"
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No template changes in this PR; skipping the template test."
          fi

  check-image:
    name: check-image
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read   # inspect the runtime image manifest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is the runtime image published?
        id: check
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE is not published yet, so the template test is skipped. The image workflow runs it after its first successful build."
          fi

  render-and-test:
    name: render-and-test
    needs: check-image
    if: needs.check-image.outputs.exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: read   # pull the runtime image
    container:
      image: ghcr.io/${{ github.repository_owner }}/mai-base:runtime
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Render template
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name=ci-sample . /tmp/ci-sample
      - name: Install, lint, test
        working-directory: /tmp/ci-sample
        run: |
          uv pip install --python /opt/venv/bin/python -c "$MAI_CONSTRAINTS" -e . pytest ruff
          ruff check . && ruff format --check .
          pytest
          python -m ci_sample.train --config configs/smoke.yaml

  # Single required check for branch rulesets. Always runs, and passes when
  # every job above either succeeded or was skipped (e.g. image-only PRs).
  template-gate:
    name: template-gate
    if: always()
    needs: [changes, check-image, render-and-test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A required template job failed"; exit 1 ;;
          esac
